<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; color: var(--wta-on-surface, #1f2937); }
.wta-blocker-panel{padding:4px}
.wta-blocker-select-btn{width:100%;background:var(--wta-accent,#ef4444);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.wta-blocker-select-btn:active{opacity:.8}
.wta-blocker-count{font-size:14px;color:var(--wta-on-surface-variant,#6b7280);margin:12px 0}
.wta-blocker-list{max-height:200px;overflow-y:auto}
.wta-blocker-item{display:flex;align-items:center;gap:8px;padding:10px;background:var(--wta-surface-dim,#f9fafb);border-radius:8px;margin-bottom:6px;font-size:13px;color:var(--wta-on-surface,#991b1b)}
.wta-blocker-item-selector{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:12px}
.wta-blocker-item-btn{background:#fee2e2;border:none;cursor:pointer;font-size:14px;color:#dc2626;padding:4px 8px;border-radius:4px;transition:all .2s}
.wta-blocker-item-btn:active{background:#fecaca}
.wta-blocker-clear-btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--wta-outline,#fecaca);background:var(--wta-surface-dim,#fff5f5);color:#dc2626;font-size:14px;cursor:pointer;transition:all .2s;margin-top:12px}
.wta-blocker-clear-btn:active{background:#fef2f2}
.wta-blocker-empty{text-align:center;padding:24px;color:var(--wta-on-surface-variant,#9ca3af)}
.wta-blocker-empty-icon{font-size:32px;margin-bottom:8px}
  #wta-toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #111827; color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 20px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  #wta-toast.show { opacity: .95; }
</style>
</head>
<body>
<div id="root"><div class="wta-blocker-empty"><div class="wta-blocker-empty-icon"><svg style="display:block;margin:0 auto" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></div><div>Loading...</div></div></div>
<div id="wta-toast"></div>
<script>
  var root = document.getElementById('root');
  var toastEl = document.getElementById('wta-toast');
  var toastTimer = null;

  function wire() {
    root.querySelectorAll('[data-wta-action]').forEach(function (el) {
      if (el.__wired) return;
      el.__wired = true;
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        hcjPanel.send({ cmd: 'act', action: el.getAttribute('data-wta-action'), arg: el.getAttribute('data-wta-arg') || '' });
      });
    });
  }

  function showToast(m) {
    toastEl.textContent = m;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  hcjPanel.onMessage(function (m) {
    if (!m) return;
    if (m.type === 'panel' && typeof m.html === 'string') { root.innerHTML = m.html; wire(); }
    else if (m.type === 'toast') showToast(m.msg || '');
    else if (m.type === 'state' && typeof render === 'function') render(m);
    else if (m.type === 'findstate' && typeof renderFind === 'function') renderFind(m);
  });


  wire();
  hcjPanel.send({ cmd: 'refresh' });
</script>
</body>
</html>
